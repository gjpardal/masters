name: Atualizar status dos servidores

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-server-status
  cancel-in-progress: true

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Consultar os bots de status
        shell: bash
        run: |
          set -euo pipefail
          fetch_status() {
            local network="$1"
            local expected="$2"
            local output="$3"
            local temporary="${output}.tmp"

            if ! curl \
              --fail \
              --show-error \
              --silent \
              --retry 3 \
              --connect-timeout 10 \
              --max-time 30 \
              "http://themasters.dyndns.org:4288/api/public/bot-status/${network}" \
              --output "${temporary}"; then
              rm -f "${temporary}"
              return 1
            fi

            if ! jq -e \
              --argjson expected "${expected}" \
              '.ok == true
               and .source == "discord-status-bot"
               and (.servers | type == "array")
               and (.servers | length == $expected)' \
              "${temporary}" > /dev/null; then
              rm -f "${temporary}"
              return 1
            fi

            jq '{
              ok,
              network,
              source,
              servers: [.servers[] | {
                id,
                online,
                players,
                maxPlayers,
                hostname
              }]
            }' "${temporary}" > "${output}"

            rm "${temporary}"
          }

          fetch_status "masters" 3 "status-masters.json"
          if ! fetch_status "rustvalley" 10 "status-valley.json"; then
            echo "::warning::Valley incompleto; mantendo o último status válido sem bloquear o Masters."
          fi

      - name: Publicar somente quando houver mudança
        shell: bash
        run: |
          if git diff --quiet -- status-masters.json status-valley.json; then
            echo "Nenhuma alteração no status."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status-masters.json status-valley.json
          git commit -m "Atualiza status dos servidores"
          git push
