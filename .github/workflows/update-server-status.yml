name: Atualizar status dos servidores

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masters-server-status
  cancel-in-progress: true

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Consultar o bot de status
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --connect-timeout 10 \
            --max-time 30 \
            "http://themasters.dyndns.org:4288/api/public/bot-status/masters" \
            --output status-masters.tmp.json

          jq -e '
            .ok == true
            and .source == "discord-status-bot"
            and (.servers | type == "array")
            and (.servers | length == 3)
          ' status-masters.tmp.json > /dev/null

          jq '.' status-masters.tmp.json > status-masters.json
          rm status-masters.tmp.json

      - name: Publicar somente quando houver mudança
        shell: bash
        run: |
          if git diff --quiet -- status-masters.json; then
            echo "Nenhuma alteração no status."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status-masters.json
          git commit -m "Atualiza status dos servidores"
          git push
